name: Anki sync

on:
  workflow_dispatch:
  # Automatic run every day
  schedule:
    - cron: "0 5 * * *"

concurrency: anki-sync

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Anki
        run: pip install anki

      - name: Add new words to AnkiWeb
        run: python anki_cloud_sync.py
        env:
          ANKIWEB_USERNAME: ${{ secrets.ANKIWEB_USERNAME }}
          ANKIWEB_PASSWORD: ${{ secrets.ANKIWEB_PASSWORD }}
